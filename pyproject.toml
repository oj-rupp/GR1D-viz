[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gr1d-viz"
version = "0.2.0"
description = "Configurable visualization of GR1D output"
readme = "README.md"
authors = [{name = "Oliver Rupp"}]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "matplotlib>=3.7"]

[project.optional-dependencies]
eos = ["scipy>=1.10", "h5py>=3.8"]
notebook = ["jupyterlab", "pillow"]

[project.scripts]
gr1d-viz = "gr1d_viz.cli:main"
gr1dviz = "gr1d_viz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
